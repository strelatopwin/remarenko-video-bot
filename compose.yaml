services:
  bot:
    build: .
    restart: unless-stopped
    depends_on:
      - telegram-api
    environment:
      BOT_TOKEN: "${BOT_TOKEN:?Set BOT_TOKEN in .env}"
      BOT_API_URL: http://telegram-api:8081
      ALLOWED_USER_IDS: "${ALLOWED_USER_IDS:-}"
    volumes:
      - telegram-data:/var/lib/telegram-bot-api:ro
  telegram-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in .env}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH in .env}"
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram-data:/var/lib/telegram-bot-api
volumes:
  telegram-data:
